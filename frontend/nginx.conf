# 前端 nginx 配置：托管静态网页 + 把 API 请求代理给后端容器
server {
    listen 80;
    # 监听 80 端口（容器内）

    server_name _;
    # 任意域名都接受（本地部署用）

    # ===== 静态文件托管 =====
    location / {
        # 所有请求默认到这里（除了下面更具体的 /ask /documents /api）
        root /usr/share/nginx/html;
        # 网页文件目录（构建产物 dist 复制到这里）
        index index.html;
        # 默认首页
        try_files $uri $uri/ /index.html;
        # ★ SPA 路由关键：请求的路径没有对应文件时，一律返回 index.html
        # 因为 Vue Router 的 history 模式路径（如 /admin）在服务器上没有真实文件，
        # 必须交给 index.html 让前端路由接管
    }

    # ===== API 代理：转发给后端容器 =====
    location /ask {
        # 流式/非流式问答接口
        proxy_pass http://backend:8000;
        # 转发到 backend 服务（docker-compose 里的服务名，容器间靠它通信）
        proxy_http_version 1.1;
        # 用 HTTP/1.1（SSE 流式需要长连接，1.0 不支持）
        proxy_set_header Connection "";
        # 清空 Connection 头（配合 1.1 支持流式）
        proxy_buffering off;
        # ★ SSE 关键：关闭缓冲，否则流式内容会被 nginx 攒着一起发，打字机效果就没了
        proxy_cache off;
        # 关闭缓存（流式内容不能缓存）
    }

    location /documents {
        # 知识库管理接口
        proxy_pass http://backend:8000;
        # 转发到后端
    }

    location /api {
        # 会话/反馈等接口
        proxy_pass http://backend:8000;
        # 转发到后端
    }
}
