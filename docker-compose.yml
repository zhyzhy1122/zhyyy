version: "3.8"
# compose 文件格式版本（写 3.8 兼容性好）

services:
# 服务列表（每个服务 = 一个容器）
  backend:
  # 服务名：backend（以后容器间通信靠这个名字）
    build:
    # 构建配置：用哪个 Dockerfile 生成镜像
      context: .
      # 构建上下文：当前目录（项目根，Dockerfile 就在这里）
      dockerfile: Dockerfile
      # 使用的 Dockerfile 文件名
    container_name: pet_shop_backend
    # 容器名字（在 Docker Desktop 里好认）
    environment:
      - REDIS_HOST=pet_redis
    # Redis 地址环境变量：容器里用服务名 pet_redis 访问（同一网络内）；本地跑默认 127.0.0.1
    ports:
    # 端口映射：电脑端口:容器端口
      - "8000:8000"
      # 访问电脑的 localhost:8000 = 访问容器里的 8000
    volumes:
    # 数据卷挂载：电脑路径:容器内路径
      - ./配置文件/config.json:/app/配置文件/config.json
      # ★ API key 注入：把电脑的 config.json 挂进容器
      # 好处：改 key 不用重新构建镜像，key 也不进镜像/仓库
      - ./chroma_db:/app/chroma_db
      # 向量数据库持久化：容器删了向量数据还在
      # 否则每次重建容器都要重新向量化所有文档
      - ./services/chat_history.db:/app/services/chat_history.db
      # 聊天记录持久化：SQLite 文件映射到电脑，删容器不丢数据
    restart: unless-stopped
    # 容器意外退出自动重启；电脑重启后 Docker 启动也会自动拉起

  frontend:
  # 前端服务（nginx 托管网页 + 代理 API）
    build:
    # 构建配置
      context: ./frontend
      # 构建上下文：frontend 目录（前端 Dockerfile 在这里）
      dockerfile: Dockerfile
      # 使用的 Dockerfile 文件名
    container_name: pet_shop_frontend
    # 容器名字（Docker Desktop 里好认）
    ports:
    # 端口映射：电脑端口:容器端口
      - "8080:80"
      # 浏览器访问 localhost:8080 = 前端网页
    depends_on:
    # 依赖关系：先启动后端，前端再启动
      - backend
      # 依赖 backend 服务（nginx 启动时后端容器已在运行）
    restart: unless-stopped
    # 意外退出自动重启
